name: Build and Deploy

on:
  push:
    branches:
      - master

env:
  REPO_TITLE: ControllerBuddy
  REPO_COMMENT: Provides the Flatpak package of ControllerBuddy
  REPO_DOMAIN: flatpak.controllerbuddy.org
  REPO_HOMEPAGE: https://controllerbuddy.org
  REPO_ICON_URL: https://raw.githubusercontent.com/bwRavencl/ControllerBuddy/refs/heads/master/icon/icon.svg

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          check_together: yes
      - name: Lint Markdown Files
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff #v24
        with:
          globs: |
            **/*.md
            !shared-modules/**

  build:
    needs: check
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-26.04-arm' || 'ubuntu-latest' }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08@sha256:6ed6921bb5a9e1a916989971844f159b854b7b225880c381fa34f7a158863039
      options: --privileged
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        arch:
          - x86_64
          - aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7
        id: gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PRIVATE_KEY_PASSPHRASE }}
      - name: Download x86_64 Repo Artifact
        if: matrix.arch == 'aarch64'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: repo-x86_64
          path: repo
      - name: Build Flatpak
        run: |
          flatpak-builder \
            --arch=${{ matrix.arch }} \
            --disable-rofiles-fuse \
            --force-clean \
            --gpg-sign=${{ steps.gpg.outputs.fingerprint }} \
            --repo=repo \
            build \
            de.bwravencl.ControllerBuddy.yml
      - name: Upload x86_64 Repo Artifact
        if: matrix.arch == 'x86_64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: repo-x86_64
          path: repo
          retention-days: 1
      - name: Update Repo
        if: matrix.arch == 'aarch64'
        run: |
          mkdir -p repo/refs/remotes
          flatpak build-update-repo \
            --gpg-sign=${{ steps.gpg.outputs.fingerprint }} \
            --title="$REPO_TITLE" \
            --comment="$REPO_COMMENT" \
            --homepage="$REPO_HOMEPAGE" \
            --icon="$REPO_ICON_URL" \
            --generate-static-deltas \
            --prune \
            repo
      - name: Generate Index
        if: matrix.arch == 'aarch64'
        run: |
          cat > repo/index.flatpakrepo <<EOF
          [Flatpak Repo]
          Title=$REPO_TITLE
          Url=https://$REPO_DOMAIN
          Homepage=$REPO_HOMEPAGE
          Comment=$REPO_COMMENT
          Icon=$REPO_ICON_URL
          GPGKey=$(gpg --export ${{ steps.gpg.outputs.fingerprint }} | base64 --wrap=0)
          EOF
      - name: Generate CNAME
        if: matrix.arch == 'aarch64'
        run: echo flatpak.controllerbuddy.org > repo/CNAME
      - name: Upload Pages Artifact
        if: matrix.arch == 'aarch64'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: repo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
