name: Update Flatpak External Data Checker

on:
  schedule:
    - cron: 0 18 * * 1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-checker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      - name: Check for Flatpak External Data Checker Update and Open PR
        shell: bash
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          base_branch=$(git rev-parse --abbrev-ref HEAD)

          if [[ $base_branch == HEAD ]]
          then
            echo '::error::This workflow must run on a branch, not a tag or detached HEAD.'
            exit 1
          fi

          image=ghcr.io/flathub-infra/flatpak-external-data-checker
          workflow_file=.github/workflows/update-manifest.yml

          pinned_digest=$(grep -oP 'flatpak-external-data-checker:latest@\Ksha256:[0-9a-f]{64}' "$workflow_file" | head -n 1 || true)
          latest_digest=$(docker buildx imagetools inspect "$image:latest" --format '{{.Manifest.Digest}}')

          if [[ -z $pinned_digest || -z $latest_digest ]]
          then
            echo '::error::Could not determine pinned or latest image digest.'
            exit 1
          fi

          echo "Pinned digest: $pinned_digest"
          echo "Latest digest: $latest_digest"

          sed -i "s/\(flatpak-external-data-checker:latest@\)sha256:[0-9a-f]\{64\}/\1$latest_digest/" "$workflow_file"

          if git diff --quiet
          then
            echo 'No changes to commit.'
            exit 0
          fi

          short_digest=${latest_digest:7:12}
          branch=github-actions/flatpak-external-data-checker-$short_digest

          if [[ -n $(gh pr list --head "$branch" --state all --json number --jq '.[].number') ]]
          then
            echo "A pull request for $branch already exists (open, closed or merged), skipping."
            exit 0
          fi

          git checkout -b "$branch"
          git commit -a -m "chore: bump flatpak-external-data-checker image to sha256:$short_digest"
          git push -f origin "$branch"

          gh pr create \
            --fill \
            --base "$base_branch" \
            --head "$branch"
